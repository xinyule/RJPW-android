name: Test Android

# RJPW own CI: manual trigger only, official GitHub actions only.
# Runs local (JVM) unit tests for the app and its library modules
# on the fdroid variant where the module defines one.
on:
  workflow_dispatch:

permissions:
  contents: read

# settings.gradle.kts reads the GitHub Packages credential for
# com.bitwarden:sdk-android from the GITHUB_TOKEN env var
# (same wiring as the upstream workflows).
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # No explicit sdkmanager step: the runner image ships the Android SDK
      # with licenses accepted and AGP auto-downloads the compileSdk 37
      # platform/build-tools (same approach as the upstream CI).
      - name: Run unit tests
        run: >
          ./gradlew
          :app:testFdroidDebugUnitTest
          :cxf:testFdroidDebugUnitTest
          :data:testDebugUnitTest
          :ui:testDebugUnitTest
          :core:testDebugUnitTest
          :network:testDebugUnitTest
          :authenticatorbridge:testDebugUnitTest
          :annotation:testDebugUnitTest
          :authenticator:testDebugUnitTest
          --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
