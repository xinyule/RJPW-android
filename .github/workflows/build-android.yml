name: Build Android

# RJPW own CI: manual trigger only, official GitHub actions only,
# no Bitwarden org resources/secrets. Builds the fdroid variant
# (project decision: fdroid route first, push notifications later).
on:
  workflow_dispatch:

permissions:
  contents: read

# settings.gradle.kts reads the GitHub Packages credential for
# com.bitwarden:sdk-android from the GITHUB_TOKEN env var
# (same wiring as the upstream workflows).
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build fdroid APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # No explicit sdkmanager step: the runner image ships the Android SDK
      # with licenses accepted and AGP auto-downloads the compileSdk 37
      # platform/build-tools (same approach as the upstream CI).
      - name: Build RJPW fdroid debug APK (repo debug keystore)
        run: ./gradlew :app:assembleFdroidDebug --stacktrace

      - name: Build RJPW fdroid release APK (unsigned)
        run: ./gradlew :app:assembleFdroidRelease --stacktrace

      - name: Build RJPW Authenticator debug APK (repo debug keystore)
        run: ./gradlew :authenticator:assembleDebug --stacktrace

      - name: Build RJPW Authenticator release APK (unsigned)
        run: ./gradlew :authenticator:assembleRelease --stacktrace

      # Since v1.0.3 both modules ship ABI-split APKs (arm64-v8a +
      # armeabi-v7a, no universal APK); each artifact below contains the
      # per-ABI APKs of one module/variant.
      - name: Upload RJPW fdroid debug APKs (ABI splits)
        uses: actions/upload-artifact@v4
        with:
          name: RJPW-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/*.apk

      - name: Upload RJPW fdroid release unsigned APKs (ABI splits)
        uses: actions/upload-artifact@v4
        with:
          name: RJPW-fdroid-release-unsigned
          path: app/build/outputs/apk/fdroid/release/*.apk

      - name: Upload RJPW Authenticator debug APKs (ABI splits)
        uses: actions/upload-artifact@v4
        with:
          name: RJPW-Authenticator-debug
          path: authenticator/build/outputs/apk/debug/*.apk

      - name: Upload RJPW Authenticator release unsigned APKs (ABI splits)
        uses: actions/upload-artifact@v4
        with:
          name: RJPW-Authenticator-release-unsigned
          path: authenticator/build/outputs/apk/release/*.apk
